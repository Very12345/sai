name: Release mobile and desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.1.25
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'ndk;28.2.13676358'
      - name: Materialize Android release keystore
        env:
          SAI_ANDROID_KEYSTORE_BASE64: ${{ secrets.SAI_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$SAI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sai-release.jks"
      - name: Test and build Android packages
        env:
          SAI_ANDROID_STORE_PASSWORD: ${{ secrets.SAI_ANDROID_STORE_PASSWORD }}
          SAI_ANDROID_KEY_ALIAS: ${{ secrets.SAI_ANDROID_KEY_ALIAS }}
          SAI_ANDROID_KEY_PASSWORD: ${{ secrets.SAI_ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease :voice-model-pack:assembleRelease cyclonedxBom -PsaiSigningStoreFile="$RUNNER_TEMP/sai-release.jks" -PsaiGithubRepository=${GITHUB_REPOSITORY} --stacktrace
      - name: Prepare Android release assets
        env:
          SAI_RUNTIME_ED25519_PRIVATE_KEY: ${{ secrets.SAI_RUNTIME_ED25519_PRIVATE_KEY }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-assets/sai-android-arm64.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk release-assets/sai-android-x86_64.apk
          cp voice-model-pack/build/outputs/apk/release/voice-model-pack-release.apk release-assets/sai-voice-pack-zh-en.apk
          cp build/reports/cyclonedx/bom.json release-assets/sai-sbom.cdx.json
          cp LICENSE release-assets/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md release-assets/THIRD_PARTY_NOTICES.md
          cp core/dsh/src/main/assets/dsh-runtime/*.tar.xz release-assets/
          node scripts/sign-runtime-manifest.mjs core/dsh/src/main/assets/dsh-runtime/manifest.json release-assets/sai-dsh-runtime-manifest.json release-assets/sai-dsh-runtime-manifest.json.sig
      - uses: actions/upload-artifact@v4
        with:
          name: sai-android
          path: release-assets/*

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build Windows companion
        working-directory: desktop
        run: pnpm build
      - name: Prepare desktop release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName release-assets/sai-desktop-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sai-desktop
          path: release-assets/*

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'preview') || contains(github.event.inputs.tag || github.ref_name, 'rc') }}
          files: release-assets/*
